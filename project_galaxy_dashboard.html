<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Razum AI Galaxy Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Let clicks pass through to canvas */
      z-index: 2;
    }
    .node-label {
      position: absolute;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(6, 182, 212, 0.4);
      padding: 10px 16px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      transform: translate(-50%, -50%);
      pointer-events: auto; /* Make labels clickable */
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      min-width: 180px;
      text-align: center;
    }
    .node-label:hover {
      border-color: #06b6d4;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
      transform: translate(-50%, -50%) scale(1.05);
    }
    .node-label.emerald {
      border-color: rgba(16, 185, 129, 0.4);
    }
    .node-label.emerald:hover {
      border-color: #10b981;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
    }
    .node-label.coral {
      border-color: rgba(244, 63, 94, 0.4);
    }
    .node-label.coral:hover {
      border-color: #f43f5e;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
    }
    
    .node-title {
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .node-subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .node-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    #hud-overlay {
      position: absolute;
      top: 30px;
      left: 30px;
      pointer-events: auto;
      z-index: 10;
    }
    .hud-title {
      font-weight: 800;
      font-size: 24px;
      background: linear-gradient(135deg, #06b6d4, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .hud-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #94a3b8;
    }
    .hud-instructions {
      margin-top: 20px;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.05);
      padding: 10px 15px;
      border-radius: 8px;
      border-left: 3px solid #06b6d4;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div id="hud-overlay">
    <div class="hud-title">GALAXY DASHBOARD 2026</div>
    <div class="hud-subtitle">RAZUM AI • SYSTEM SNAPSHOT v2.4</div>
    <div class="hud-instructions">
      🪐 Вращайте камеру левой кнопкой мыши<br>
      🔍 Приближайте скроллом<br>
      👆 Кликайте по модулям для перехода
    </div>
  </div>

  <div id="ui-layer"></div>

  <!-- Load Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // System Data
    const projectNodes = [
      { id: 'core', title: 'Главный ИИ-Центр', subtitle: 'Razum AI Core', icon: '🌌', color: 0xffffff, x: 0, y: 0, z: 0, link: null, style: '' },
      
      // Orbit 1: Strategy & CRM
      { id: 'pitch', title: 'Interactive Pitch Deck', subtitle: 'Сделки & Офферы', icon: '📊', color: 0x10b981, x: 25, y: 5, z: 15, link: 'client_presentation.html', style: 'emerald' },
      { id: 'sov_landing', title: 'Sovereign Landing', subtitle: 'B2B Трансформация', icon: '🌐', color: 0x10b981, x: -20, y: -5, z: 22, link: 'sovereign_transformation.html', style: 'emerald' },
      
      // Orbit 2: Content & Production
      { id: 'prompter', title: 'Студия Телесуфлера', subtitle: 'Запись дублей', icon: '📜', color: 0x06b6d4, x: 35, y: 15, z: -25, link: 'teleprompter_studio.html', style: '' },
      { id: 'reels', title: 'Reels Preview Studio', subtitle: 'Конвейер Shorts', icon: '🎥', color: 0x06b6d4, x: -30, y: 10, z: -30, link: '05_Content/Video/reels_preview_studio.html', style: '' },
      { id: 'video_studio', title: 'Студия 9:16', subtitle: 'Рендер & Репетиция', icon: '📱', color: 0x06b6d4, x: 0, y: 25, z: -40, link: 'ai_video_studio.html', style: '' },

      // Orbit 3: Backend & Tech
      { id: 'swarm', title: 'Swarm Агенты', subtitle: 'Автоматизация & Память', icon: '🤖', color: 0xf43f5e, x: -45, y: -15, z: 5, link: null, style: 'coral' },
      { id: 'packages', title: 'Архив Пакетов', subtitle: 'Готовые решения', icon: '📦', color: 0xf43f5e, x: 40, y: -20, z: -5, link: 'store_packages.html', style: 'coral' }
    ];

    // Three.js Setup
    const container = document.getElementById('canvas-container');
    const uiLayer = document.getElementById('ui-layer');
    
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.007);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 80);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 200;
    controls.minDistance = 20;

    // Background Stars (Particles)
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 3000;
    const posArray = new Float32Array(starsCount * 3);
    const colorsArray = new Float32Array(starsCount * 3);

    for(let i = 0; i < starsCount * 3; i+=3) {
      // Spread in a large disk (galaxy shape)
      const radius = 200 * Math.random();
      const theta = 2 * Math.PI * Math.random();
      const height = (Math.random() - 0.5) * 40;
      
      posArray[i] = radius * Math.cos(theta); // x
      posArray[i+1] = height; // y
      posArray[i+2] = radius * Math.sin(theta); // z

      // Subtle cyan/emerald tint to stars
      colorsArray[i] = 0.5 + Math.random() * 0.5; // r
      colorsArray[i+1] = 0.8 + Math.random() * 0.2; // g
      colorsArray[i+2] = 1.0; // b
    }

    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    starsGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));
    
    const starsMaterial = new THREE.PointsMaterial({
      size: 0.8,
      vertexColors: true,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending
    });
    const starMesh = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starMesh);

    // Nodes (Planets) and HTML Labels
    const nodeMeshes = [];
    const htmlElements = [];

    // Core glow material
    const getGlowMaterial = (color) => {
      return new THREE.MeshBasicMaterial({ 
        color: color, 
        transparent: true, 
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });
    };

    projectNodes.forEach(node => {
      // Create 3D Sphere
      const geometry = new THREE.SphereGeometry(node.id === 'core' ? 4 : 2.5, 32, 32);
      const material = new THREE.MeshStandardMaterial({ 
        color: node.color,
        emissive: node.color,
        emissiveIntensity: 0.5,
        roughness: 0.2,
        metalness: 0.8
      });
      const sphere = new THREE.Mesh(geometry, material);
      sphere.position.set(node.x, node.y, node.z);
      scene.add(sphere);
      nodeMeshes.push(sphere);

      // Create outer glow (slightly larger sphere)
      const glowGeo = new THREE.SphereGeometry(node.id === 'core' ? 5.5 : 3.5, 32, 32);
      const glowMesh = new THREE.Mesh(glowGeo, getGlowMaterial(node.color));
      sphere.add(glowMesh);

      // Create HTML Label
      const el = document.createElement('div');
      el.className = `node-label ${node.style}`;
      el.innerHTML = `
        <div class="node-icon">${node.icon}</div>
        <div class="node-title">${node.title}</div>
        <div class="node-subtitle">${node.subtitle}</div>
      `;
      
      if(node.link) {
        el.onclick = () => {
          window.open(node.link, '_blank');
        };
      } else {
        el.style.cursor = 'default';
        el.onclick = () => {
          el.querySelector('.node-subtitle').innerText = "В разработке / Бекэнд";
          setTimeout(() => el.querySelector('.node-subtitle').innerText = node.subtitle, 2000);
        }
      }

      uiLayer.appendChild(el);
      htmlElements.push({ element: el, mesh: sphere });
    });

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);
    
    const pointLight = new THREE.PointLight(0x06b6d4, 2, 100);
    pointLight.position.set(0, 10, 0);
    scene.add(pointLight);

    // Connecting lines (Constellations)
    const lineMat = new THREE.LineBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.2 });
    projectNodes.forEach((node, i) => {
      if (node.id !== 'core') {
        const points = [];
        points.push(new THREE.Vector3(0, 0, 0)); // Core
        points.push(new THREE.Vector3(node.x, node.y, node.z));
        const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(lineGeo, lineMat);
        scene.add(line);
      }
    });

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      
      const elapsedTime = clock.getElapsedTime();

      // Slow rotation of the galaxy background
      starMesh.rotation.y = elapsedTime * 0.05;

      // Update Controls
      controls.update();

      // Update HTML Labels positions
      htmlElements.forEach(item => {
        const vector = item.mesh.position.clone();
        
        // Add a slight bobbing animation to the 3D meshes
        if(item.mesh.position.x !== 0) { // skip core
          item.mesh.position.y = vector.y + Math.sin(elapsedTime * 2 + vector.x) * 0.02;
        }

        vector.project(camera);
        
        // Convert to CSS coordinates
        const x = (vector.x * .5 + .5) * window.innerWidth;
        const y = (vector.y * -.5 + .5) * window.innerHeight;

        // Hide label if it goes behind the camera
        if (vector.z > 1) {
          item.element.style.display = 'none';
        } else {
          item.element.style.display = 'flex';
          // Offset label above the planet
          item.element.style.left = `${x}px`;
          item.element.style.top = `${y - 50}px`;
        }
      });

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
