<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Shorts & Reels Video Studio 2026 • RAZUM AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    html, body {
      background-color: #030712 !important;
      color: #f8fafc !important;
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }
    .page-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 16px 80px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 9:16 PHONE PREVIEW BOX */
    .phone-box {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      height: 520px;
      background: #090d16;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-radius: 32px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(6, 182, 212, 0.2);
      display: flex;
      flex-direction: column;
    }
    .preview-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      background: #0f172a;
    }
    .watermark-r {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      height: 160px;
      background: url('assets/razum_logo.jpg') center/contain no-repeat;
      opacity: 0.15;
      filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.6));
      pointer-events: none;
      z-index: 5;
    }
    .video-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 25%, transparent 65%, rgba(0,0,0,0.92) 100%);
      pointer-events: none;
    }
    .caption-box {
      text-align: center;
      margin-top: auto;
      margin-bottom: 16px;
      z-index: 20;
    }
    .caption-hook {
      font-size: 17px;
      font-weight: 900;
      color: #fbbf24;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.95), 0 0 15px rgba(251, 191, 36, 0.5);
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .caption-body {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.95);
      line-height: 1.4;
      background: rgba(0, 0, 0, 0.75);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: inline-block;
    }

    /* BIG TOUCH BUTTONS */
    .touch-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px 20px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .touch-btn-red {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      color: #ffffff;
    }
    .touch-btn-green {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
    }
    .touch-btn-dark {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .badge-v {
      display: inline-block;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>

  <div class="page-wrap">

    <!-- HEADER -->
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="brand-logo" style="width:34px; height:34px; border-radius:8px;"></div>
        <div>
          <div style="font-weight:800; font-size:15px; color:#fff;">RAZUM SHORTS STUDIO</div>
          <span class="badge-v">✓ v2026.6 NATIVE CAM</span>
        </div>
      </div>
      <div style="display:flex; gap:8px;">
        <a href="teleprompter_studio.html" class="btn btn-secondary btn-sm" style="padding:6px 12px; font-size:12px;">🎙️ Суфлер</a>
        <a href="client_portal.html" class="btn btn-secondary btn-sm" style="padding:6px 12px; font-size:12px;">👑 Портал</a>
      </div>
    </div>

    <!-- 9:16 PREVIEW -->
    <div class="phone-box">
      <video id="preview-video" class="preview-video" playsinline webkit-playsinline muted loop></video>
      <div class="watermark-r"></div>
      <div class="video-overlay">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div id="timer-badge" style="display:none; background:rgba(244,63,94,0.3); border:1px solid #f43f5e; color:#f43f5e; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:800; font-family:var(--font-mono);">
            ● REC <span id="timer-val">00:15</span>
          </div>
          <div style="font-family:var(--font-mono); font-size:11px; color:#38bdf8; font-weight:700;">
            9:16 SHORTS
          </div>
        </div>
        <div class="caption-box">
          <div id="video-hook-text" class="caption-hook">
            «ХВАТИТ ТРАТИТЬ $2,500 НА ПУСТЫЕ AI-ПОДПИСКИ»
          </div>
          <div id="video-body-text" class="caption-body">
            Суверенный Google Workspace контур окупается за 4 дня.
          </div>
        </div>
      </div>
    </div>

    <!-- RECORDING ACTION BUTTONS -->
    <div style="display:flex; flex-direction:column; gap:12px;">
      
      <!-- 100% NATIVE iOS / ANDROID DIRECT LABEL TRIGGER -->
      <label for="phone-camera-input" class="touch-btn touch-btn-red" style="cursor:pointer; position:relative; overflow:hidden;">
        <input type="file" id="phone-camera-input" accept="video/*" capture="user" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer;" onchange="onVideoRecorded(event)">
        📹 Запустить Камеру Телефона (Запись)
      </label>

      <button id="btn-rehearse" class="touch-btn touch-btn-green" onclick="toggleRehearsal()">
        ⏱️ Запустить Титры и Таймер (15 сек)
      </button>

      <a id="btn-dl" class="touch-btn touch-btn-dark" style="display:none;">
        💾 Скачать Записанное Видео
      </a>

    </div>

    <!-- SCRIPT SELECTOR -->
    <div style="background:#0f172a; border:1px solid rgba(255,255,255,0.12); padding:18px; border-radius:18px;">
      <div style="font-weight:800; font-size:14px; margin-bottom:12px; color:#fff;">🎬 Выберите сценарий Агента 4:</div>
      
      <select id="sel-script" style="width:100%; background:#020617; border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:13px; padding:12px; border-radius:12px; margin-bottom:12px;" onchange="applyScript()">
        <option value="1">🔥 Сценарий 1: Суверенная Экосистема vs SaaS ($300)</option>
        <option value="2">⚡ Сценарий 2: Разбор счетов PDF за 3 сек ($50)</option>
        <option value="3">🎯 Сценарий 3: B2B Скоринг по Хормози ($200)</option>
        <option value="4">👑 Сценарий 4: White-Label AI-Геном ($500)</option>
      </select>

      <input type="text" id="in-hook" style="width:100%; background:#020617; border:1px solid rgba(255,255,255,0.15); color:#fbbf24; font-weight:700; font-size:13px; padding:10px; border-radius:10px; margin-bottom:8px;" oninput="syncText()">
      <textarea id="in-body" style="width:100%; background:#020617; border:1px solid rgba(255,255,255,0.15); color:#f8fafc; font-size:13px; padding:10px; border-radius:10px; height:54px;" oninput="syncText()"></textarea>
    </div>

  </div>

  <script>
    const scripts = {
      "1": { hook: "«ХВАТИТ ТРАТИТЬ $2,500 НА ПУСТЫЕ AI-ПОДПИСКИ»", body: "Суверенный Google Workspace контур окупается за 4 дня. Разовая оплата. Без подписки." },
      "2": { hook: "«КАК ОБРАБАТЫВАТЬ 500 СЧЕТОВ ЗА 3 СЕКУНДЫ?»", body: "Zero-Log парсер счетов сразу в Google Таблицу без утечек данных." },
      "3": { hook: "«ПОЧЕМУ ВАШИ МЕНЕДЖЕРЫ ТЕРЯЮТ B2B СДЕЛКИ?»", body: "Hormozi 4-Factor скоринг закрывает VIP-клиентов в день обращения." },
      "4": { hook: "«СОЗДАЙТЕ СВОЙ СОБСТВЕННЫЙ AI-РОЙ ПОД КЛЮЧ»", body: "5 автономных агентов работают в облаке 24/7. White-Label перепродажа." }
    };

    function applyScript() {
      const val = document.getElementById('sel-script').value;
      const s = scripts[val] || scripts["1"];
      document.getElementById('in-hook').value = s.hook;
      document.getElementById('in-body').value = s.body;
      syncText();
    }

    function syncText() {
      document.getElementById('video-hook-text').innerText = document.getElementById('in-hook').value;
      document.getElementById('video-body-text').innerText = document.getElementById('in-body').value;
    }

    function openCamera() {
      document.getElementById('phone-camera-input').click();
    }

    function onVideoRecorded(e) {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      const v = document.getElementById('preview-video');
      v.src = url;
      v.play().catch(err => console.log(err));

      const dl = document.getElementById('btn-dl');
      dl.href = url;
      dl.download = `RAZUM_SHORTS_${Date.now()}.mp4`;
      dl.style.display = 'flex';
      dl.innerText = '💾 Скачать Готовое Видео (' + Math.round(file.size / 1024) + ' KB)';
    }

    let interval = null;
    let sec = 15;
    let timing = false;

    function toggleRehearsal() {
      const btn = document.getElementById('btn-rehearse');
      const badge = document.getElementById('timer-badge');
      const val = document.getElementById('timer-val');
      const hook = document.getElementById('video-hook-text');

      if (timing) {
        clearInterval(interval);
        timing = false;
        badge.style.display = 'none';
        btn.innerText = '⏱️ Запустить Титры и Таймер (15 сек)';
        hook.style.color = '#fbbf24';
        return;
      }

      timing = true;
      sec = 15;
      badge.style.display = 'block';
      val.innerText = '00:15';
      btn.innerText = '⏹️ Остановить Таймер';

      interval = setInterval(() => {
        sec--;
        val.innerText = '00:' + String(sec).padStart(2, '0');
        hook.style.color = (sec % 2 === 0) ? '#38bdf8' : '#fbbf24';

        if (sec <= 0) {
          clearInterval(interval);
          timing = false;
          badge.style.display = 'none';
          btn.innerText = '⏱️ Запустить Титры и Таймер (15 сек)';
          hook.style.color = '#fbbf24';
          alert('✓ 15 секунд истекли! Титры отрепетированы.');
        }
      }, 1000);
    }

    document.addEventListener('DOMContentLoaded', applyScript);
  </script>
</body>
</html>
