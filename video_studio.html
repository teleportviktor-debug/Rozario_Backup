<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shorts & Reels Video Studio 2026 • RAZUM AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: var(--font-sans);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .studio-layout {
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
      width: 100%;
      flex: 1;
    }
    @media (max-width: 900px) {
      .studio-layout {
        display: flex;
        flex-direction: column-reverse;
      }
    }

    /* 9:16 PHONE MOCKUP */
    .phone-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .phone-mockup {
      width: 100%;
      max-width: 360px;
      height: 580px;
      background: #090d16;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-radius: 36px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(6, 182, 212, 0.2);
      display: flex;
      flex-direction: column;
    }
    .camera-feed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      background: #0f172a;
    }
    .video-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 18px;
      background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, transparent 25%, transparent 65%, rgba(0,0,0,0.9) 100%);
      pointer-events: none;
    }

    /* WATERMARK LOGO */
    .watermark-r {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      background: url('assets/razum_logo.jpg') center/contain no-repeat;
      opacity: 0.15;
      filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.6));
      pointer-events: none;
      z-index: 5;
    }

    /* KINETIC HORMOZI CAPTIONS */
    .caption-box {
      text-align: center;
      margin-top: auto;
      margin-bottom: 20px;
      z-index: 20;
    }
    .caption-hook {
      font-size: 18px;
      font-weight: 900;
      color: #fbbf24;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 15px rgba(251, 191, 36, 0.5);
      line-height: 1.3;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    .caption-body {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      line-height: 1.4;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: inline-block;
    }

    .rec-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(244, 63, 94, 0.25);
      border: 1px solid rgba(244, 63, 94, 0.5);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: #f43f5e;
      font-family: var(--font-mono);
    }
    .rec-dot {
      width: 8px;
      height: 8px;
      background: #f43f5e;
      border-radius: 50%;
      animation: blink-rec 1s infinite;
    }
    @keyframes blink-rec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .action-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    .action-btn-primary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
    }
    .action-btn-danger {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(244, 63, 94, 0.4);
    }
    .action-btn-secondary {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="top-header" style="max-width:1200px; margin:0 auto; width:100%; padding:14px 16px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="brand-logo" style="width:36px; height:36px; border-radius:8px;"></div>
      <div>
        <div style="font-weight:800; font-size:15px; color:#fff;">RAZUM AI • SHORTS STUDIO</div>
        <div style="font-size:11px; color:var(--text-dim);">Agent 4 Viral Video Generator 2026</div>
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <a href="teleprompter_studio.html" class="btn btn-secondary btn-sm" style="font-size:12px; padding:6px 12px;">🎙️ Суфлер</a>
      <a href="client_portal.html" class="btn btn-secondary btn-sm" style="font-size:12px; padding:6px 12px;">👑 Портал</a>
    </div>
  </header>

  <div class="studio-layout">

    <!-- 9:16 PHONE PREVIEW -->
    <div class="phone-container">
      <div class="phone-mockup">
        
        <video id="camera-feed" class="camera-feed" autoplay playsinline webkit-playsinline muted loop></video>

        <div class="watermark-r"></div>

        <div class="video-overlay">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div id="rec-badge" class="rec-indicator" style="display:none;">
              <span class="rec-dot"></span>
              <span id="rec-timer">00:00</span>
            </div>
            <div style="font-family:var(--font-mono); font-size:11px; color:var(--cyan-400); font-weight:700;">
              9:16 SHORTS
            </div>
          </div>

          <!-- KINETIC CAPTION -->
          <div class="caption-box">
            <div id="video-hook-text" class="caption-hook">
              «ХВАТИТ ТРАТИТЬ $2,500 НА ПУСТЫЕ AI-ПОДПИСКИ»
            </div>
            <div id="video-body-text" class="caption-body">
              Суверенный Google Workspace контур окупается за 4 дня.
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- CONTROLS -->
    <div>
      
      <!-- SCRIPT SELECTION -->
      <div class="panel" style="margin-bottom:16px; background:#0f172a; border:1px solid rgba(255,255,255,0.12); padding:20px; border-radius:18px;">
        <div class="panel-header" style="margin-bottom:14px;">
          <div class="panel-title" style="font-size:16px; color:#fff; font-weight:800;">🎬 Сценарии Агента 4</div>
        </div>

        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label" style="font-size:12px; color:#94a3b8; font-weight:700;">Выберите тему видео:</label>
          <select id="select-video-script" class="form-control" style="background:#020617; border:1px solid rgba(255,255,255,0.15); color:#fff; font-size:13px; padding:10px;" onchange="loadVideoScript()">
            <option value="1">🔥 Сценарий 1: Суверенная Экосистема vs SaaS ($300)</option>
            <option value="2">⚡ Сценарий 2: Разбор счетов PDF за 3 сек ($50)</option>
            <option value="3">🎯 Сценарий 3: B2B Скоринг по Хормози ($200)</option>
            <option value="4">👑 Сценарий 4: White-Label AI-Геном ($500)</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label" style="font-size:12px; color:#94a3b8; font-weight:700;">Текст хука:</label>
          <input type="text" id="input-hook-text" class="form-control" style="background:#020617; border:1px solid rgba(255,255,255,0.15); color:#fbbf24; font-weight:700; font-size:13px;" oninput="updateLiveCaptions()">
        </div>

        <div class="form-group">
          <label class="form-label" style="font-size:12px; color:#94a3b8; font-weight:700;">Польза / Оффер:</label>
          <textarea id="input-body-text" class="form-control" style="background:#020617; border:1px solid rgba(255,255,255,0.15); color:#f8fafc; font-size:13px; height:60px;" oninput="updateLiveCaptions()"></textarea>
        </div>
      </div>

      <!-- 1-TAP NATIVE CAMERA & RECORD BUTTONS -->
      <div class="panel" style="background:#0f172a; border:1px solid rgba(255,255,255,0.12); padding:20px; border-radius:18px;">
        <div class="panel-header" style="margin-bottom:14px;">
          <div class="panel-title" style="font-size:16px; color:#fff; font-weight:800;">📹 Запись и Репетиция</div>
        </div>

        <div style="display:flex; flex-direction:column; gap:12px;">
          
          <!-- NATIVE PHONE CAMERA (NEVER HANGS ON MOBILE) -->
          <input type="file" id="native-video-capture" accept="video/*" capture="user" style="display:none;" onchange="handleNativeVideoUpload(event)">
          
          <button class="action-btn action-btn-danger" onclick="triggerNativeCamera()">
            📹 Запустить Камеру Телефона (Запись)
          </button>

          <button id="btn-timer" class="action-btn action-btn-primary" onclick="toggleTimerRehearsal()">
            ⏱️ Репетиция Титров (15 сек)
          </button>

          <a id="btn-download" class="action-btn action-btn-secondary" style="display:none; text-decoration:none;">
            💾 Скачать Записанное Видео
          </a>

        </div>
      </div>

    </div>

  </div>

  <script>
    const scripts = {
      "1": {
        hook: "«ХВАТИТ ТРАТИТЬ $2,500 НА ПУСТЫЕ AI-ПОДПИСКИ»",
        body: "Суверенный Google Workspace контур окупается за 4 дня. Разовая оплата. Без подписки."
      },
      "2": {
        hook: "«КАК ОБРАБАТЫВАТЬ 500 СЧЕТОВ ЗА 3 СЕКУНДЫ?»",
        body: "Zero-Log парсер счетов сразу в Google Таблицу без утечек данных."
      },
      "3": {
        hook: "«ПОЧЕМУ ВАШИ МЕНЕДЖЕРЫ ТЕРЯЮТ B2B СДЕЛКИ?»",
        body: "Hormozi 4-Factor скоринг закрывает VIP-клиентов в день обращения."
      },
      "4": {
        hook: "«СОЗДАЙТЕ СВОЙ СОБСТВЕННЫЙ AI-РОЙ ПОД КЛЮЧ»",
        body: "5 автономных агентов работают в облаке 24/7. White-Label перепродажа."
      }
    };

    function loadVideoScript() {
      const id = document.getElementById('select-video-script').value;
      const s = scripts[id] || scripts["1"];
      document.getElementById('input-hook-text').value = s.hook;
      document.getElementById('input-body-text').value = s.body;
      updateLiveCaptions();
    }

    function updateLiveCaptions() {
      const h = document.getElementById('input-hook-text').value;
      const b = document.getElementById('input-body-text').value;
      document.getElementById('video-hook-text').innerText = h;
      document.getElementById('video-body-text').innerText = b;
    }

    // 1. NATIVE 1-TAP PHONE CAMERA (100% RELIABLE ON iOS & ANDROID)
    function triggerNativeCamera() {
      document.getElementById('native-video-capture').click();
    }

    function handleNativeVideoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const videoEl = document.getElementById('camera-feed');
      const fileUrl = URL.createObjectURL(file);
      videoEl.src = fileUrl;
      videoEl.play().catch(e => console.log(e));

      const downloadBtn = document.getElementById('btn-download');
      downloadBtn.href = fileUrl;
      downloadBtn.download = `RAZUM_SHORTS_${Date.now()}.mp4`;
      downloadBtn.style.display = 'flex';
      downloadBtn.innerText = '💾 Скачать Записанное Видео (' + Math.round(file.size / 1024) + ' KB)';
    }

    // 2. TIMED REHEARSAL
    let timerInterval = null;
    let secondsLeft = 15;
    let isTiming = false;

    function toggleTimerRehearsal() {
      const btn = document.getElementById('btn-timer');
      const recBadge = document.getElementById('rec-badge');
      const timerEl = document.getElementById('rec-timer');
      const hookEl = document.getElementById('video-hook-text');

      if (isTiming) {
        clearInterval(timerInterval);
        isTiming = false;
        recBadge.style.display = 'none';
        btn.innerText = '⏱️ Репетиция Титров (15 сек)';
        hookEl.style.transform = 'scale(1.0)';
        hookEl.style.color = '#fbbf24';
        return;
      }

      isTiming = true;
      secondsLeft = 15;
      recBadge.style.display = 'inline-flex';
      btn.innerText = '⏹️ Остановить';
      timerEl.innerText = '00:15';

      timerInterval = setInterval(() => {
        secondsLeft--;
        const s = String(secondsLeft).padStart(2, '0');
        timerEl.innerText = `00:${s}`;

        // Pulse caption color
        if (secondsLeft % 2 === 0) {
          hookEl.style.transform = 'scale(1.04)';
          hookEl.style.color = '#38bdf8';
        } else {
          hookEl.style.transform = 'scale(1.0)';
          hookEl.style.color = '#fbbf24';
        }

        if (secondsLeft <= 0) {
          toggleTimerRehearsal();
          alert('✓ 15 секунд истекли! Отличный хронометраж для Shorts.');
        }
      }, 1000);
    }

    document.addEventListener('DOMContentLoaded', loadVideoScript);
  </script>
</body>
</html>
