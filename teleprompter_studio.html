<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Teleprompter Studio PRO 2026 | Мобильный AI-Телесуфлер</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-neon: #10b981;
      --cyan-neon: #06b6d4;
      --amber-neon: #f59e0b;
      --rose-neon: #f43f5e;
      --bg-pure: #000000;
      --surface: #0f172a;
      --surface-border: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg-pure) !important;
      color: #ffffff !important;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
    }

    /* WEBCAM BACKGROUND */
    #webcam-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      z-index: 1;
      display: none;
      transform: scaleX(-1);
    }
    #webcam-video.active { display: block; }
    #webcam-shade {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 2;
      display: none;
      pointer-events: none;
    }
    #webcam-shade.active { display: block; }

    /* WATERMARK */
    .teleprompter-watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      background: url('assets/razum_logo.jpg') center/contain no-repeat;
      opacity: 0.06;
      pointer-events: none;
      z-index: 3;
    }

    /* EYE LEVEL CUE MARKER */
    .cue-marker {
      position: fixed;
      top: 36%;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(16, 185, 129, 0.9) 25%, rgba(6, 182, 212, 1) 50%, rgba(16, 185, 129, 0.9) 75%, transparent 100%);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.9);
      pointer-events: none;
      z-index: 40;
    }
    .cue-marker::before {
      content: '▶ ВЗГЛЯД В КАМЕРУ';
      position: absolute;
      left: 12px;
      top: -11px;
      font-size: 9px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: #6ee7b7;
      background: rgba(0, 0, 0, 0.9);
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    /* SCROLL CONTENT */
    .teleprompter-content-area {
      position: absolute;
      inset: 0;
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-behavior: auto !important;
      -webkit-overflow-scrolling: touch;
      padding: 34vh 16px 55vh 16px;
      line-height: 1.6;
      text-align: center;
      z-index: 10;
      cursor: pointer;
    }

    .teleprompter-content-area.mirrored { transform: scaleX(-1); }

    .highlight-hook {
      color: var(--amber-neon);
      font-weight: 900;
      display: block;
      margin-bottom: 20px;
      text-shadow: 0 0 16px rgba(245, 158, 11, 0.4);
    }
    .highlight-fact {
      color: var(--primary-neon);
      font-weight: 800;
    }
    .highlight-cta {
      color: var(--cyan-neon);
      font-weight: 900;
      margin-top: 30px;
      display: block;
      text-shadow: 0 0 16px rgba(6, 182, 212, 0.5);
    }

    /* COMPACT TOP BAR */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--surface-border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 100;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .top-bar.hidden {
      transform: translateY(-110%);
      opacity: 0;
      pointer-events: none;
    }

    .select-script-wrap {
      flex: 1;
      max-width: calc(100vw - 110px);
    }
    .script-select {
      width: 100%;
      background: #090d16;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      outline: none;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    /* PILL BUTTONS */
    .pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pill-btn:active { background: rgba(255, 255, 255, 0.25); }
    .pill-btn.active {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-color: #10b981;
    }

    /* BOTTOM CONTROL DOCK (STACKED & FULLY RESPONSIVE) */
    .bottom-dock {
      position: fixed;
      bottom: 12px;
      left: 10px;
      right: 10px;
      max-width: 500px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--surface-border);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85), 0 0 20px rgba(16, 185, 129, 0.2);
      border-radius: 20px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .bottom-dock.hidden {
      transform: translateY(140%);
      opacity: 0;
      pointer-events: none;
    }

    .dock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }

    .big-start-btn {
      flex: 1;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }
    .big-start-btn.playing {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
    }

    /* COUNTDOWN */
    .countdown-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.75);
      z-index: 200;
      font-family: 'JetBrains Mono', monospace;
      font-size: 110px;
      font-weight: 900;
      color: var(--primary-neon);
      text-shadow: 0 0 35px rgba(16, 185, 129, 0.9);
      animation: countPulse 0.8s ease infinite;
    }
    .countdown-overlay.active { display: flex; }

    @keyframes countPulse {
      0% { transform: scale(0.6); opacity: 0.3; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }

    /* EDIT MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.active { display: flex; }
    .modal-box {
      background: #0f172a;
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      max-width: 500px;
      width: 100%;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <!-- CAMERA FEED & SHADE -->
  <video id="webcam-video" autoplay playsinline muted></video>
  <div id="webcam-shade"></div>

  <!-- WATERMARK -->
  <div class="teleprompter-watermark"></div>

  <!-- CUE LINE -->
  <div class="cue-marker"></div>

  <!-- COUNTDOWN -->
  <div id="countdown-modal" class="countdown-overlay">3</div>

  <!-- TOP BAR -->
  <header id="top-bar" class="top-bar">
    <a href="video_studio.html" class="pill-btn">🎬 Студия</a>
    
    <div class="select-script-wrap">
      <select id="select-script" class="script-select">
        <option value="script1">⚡ 1. Суверенный Контур ($300)</option>
        <option value="script2">📑 2. Разбор счетов PDF ($50)</option>
        <option value="script3">🎯 3. Hormozi B2B ($200)</option>
        <option value="script4">👑 4. White-Label AI ($500)</option>
        <option value="script5">🚀 5. Видео-Аудит ($2,500)</option>
        <option value="script6">🔥 6. Секрет 180 WPM</option>
        <option value="custom">✍️ Свой текст...</option>
      </select>
    </div>

    <button class="pill-btn" onclick="openEditModal()">✏️ Текст</button>
  </header>

  <!-- SCROLLING AREA -->
  <main id="teleprompter-box" class="teleprompter-content-area" style="font-size: 32px;">
    <!-- Text via JS -->
  </main>

  <!-- BOTTOM CONTROL DOCK -->
  <footer id="bottom-dock" class="bottom-dock">
    <!-- ROW 1: PRIMARY ACTIONS -->
    <div class="dock-row">
      <button id="btn-play-pause" class="big-start-btn" onclick="togglePlay()">
        ▶ СТАРТ
      </button>

      <button id="btn-mirror" class="pill-btn" onclick="toggleMirror()" style="padding:11px 12px;">
        🪞 Зеркало
      </button>

      <button id="btn-camera" class="pill-btn" onclick="toggleCamera()" style="padding:11px 12px;">
        📷 Камера
      </button>

      <button class="pill-btn" onclick="resetToTop()" style="padding:11px 12px;" title="В начало">
        ⏮ Вверх
      </button>
    </div>

    <!-- ROW 2: FONT SIZE & SPEED -->
    <div class="dock-row" style="background:rgba(0,0,0,0.3); padding:4px 8px; border-radius:12px;">
      <!-- FONT -->
      <div style="display:flex; align-items:center; gap:4px;">
        <span style="font-size:11px; color:#94a3b8; font-weight:700;">Шрифт:</span>
        <button class="pill-btn" onclick="changeFontSize(-3)" style="padding:4px 8px;">A-</button>
        <span id="font-size-val" style="font-family:'JetBrains Mono'; font-size:12px; font-weight:700; width:34px; text-align:center;">32px</span>
        <button class="pill-btn" onclick="changeFontSize(3)" style="padding:4px 8px;">A+</button>
      </div>

      <!-- SPEED -->
      <div style="display:flex; align-items:center; gap:6px;">
        <span style="font-size:11px; color:#94a3b8; font-weight:700;">Скорость:</span>
        <input type="range" id="speed-slider" min="1" max="12" value="4" style="width:70px; accent-color:var(--primary-neon); cursor:pointer;">
        <span id="speed-badge" style="font-family:'JetBrains Mono'; font-size:12px; font-weight:800; color:var(--primary-neon);">4x</span>
      </div>
    </div>
  </footer>

  <!-- EDIT MODAL -->
  <div id="edit-modal" class="modal">
    <div class="modal-box">
      <div style="font-size:16px; font-weight:800; margin-bottom:8px; color:var(--primary-neon);">
        ✏️ Редактор Текста
      </div>
      <textarea id="custom-script-text" style="width:100%; height:200px; background:#030712; color:#ffffff; border:1px solid rgba(255,255,255,0.2); border-radius:10px; padding:10px; font-family:'JetBrains Mono', monospace; font-size:13px; outline:none; resize:none; margin-bottom:12px;"></textarea>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="pill-btn" onclick="closeEditModal()">Отмена</button>
        <button class="big-start-btn" onclick="applyCustomScript()" style="padding:8px 14px; font-size:12px; flex:none;">Применить 🚀</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPTS = {
      script1: `
        <div class="highlight-hook">[ХУК 0-3 СЕК] «80% компаний, внедривших AI в 2025 году, выкинули деньги на ветер! Вот почему...»</div>
        <p style="margin-bottom:28px; color:#cbd5e1;">Большинство думает, что для автоматизации нужны дорогие платформы с подпиской по $100 за сотрудника и бесконечные кредиты.</p>
        <p style="margin-bottom:28px;">Но в 2026 году выигрывает тот, кто использует <span class="highlight-fact">СУВЕРЕННЫЙ КОНТУР GOOGLE WORKSPACE</span>.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">1. Все счета и первичка разбираются за 3 секунды без риска утечки данных.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">2. Математический скоринг лидов считает окупаемость на Python со 100% точностью.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">3. Никаких подписок. Один разовый платёж — и система работает у вас навсегда.</p>
        <div class="highlight-cta">[CTA] «Напишите слово "СУВЕРЕНИТЕТ" в комментарии — я пришлю вам живой расчет экономии прямо сейчас!»</div>
      `,
      script2: `
        <div class="highlight-hook">[ХУК 0-3 СЕК] «Вот как бухгалтер тратит ровно 5 минут в день на разбор 100 входящих счетов!»</div>
        <p style="margin-bottom:28px; color:#cbd5e1;">Вам больше не нужно вручную перебивать ИНН, суммы и номенклатуру из PDF в таблицы.</p>
        <p style="margin-bottom:28px;"><span class="highlight-fact">Zero-Leakage Gemini Flash Lite</span> автоматически парсит вложения прямо из вашей почты Gmail.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">1. Строгая валидация реквизитов и математический пересчет НДС.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">2. Данные заносятся в Google Таблицу за 2.4 секунды.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">3. Разовый пакет от $50 без ежемесячных платежей.</p>
        <div class="highlight-cta">[CTA] «Кликайте ссылку в профиле — развернем контур в вашей Google Таблице за 24 часа!»</div>
      `,
      script3: `
        <div class="highlight-hook">[ХУК 0-3 СЕК] «Как удвоить продажи в B2B без найма новых менеджеров?»</div>
        <p style="margin-bottom:28px; color:#cbd5e1;">Менеджеры тратят 70% времени на пустые разговоры с нецелевыми лидами.</p>
        <p style="margin-bottom:28px;">Модуль <span class="highlight-fact">B2B Intelligence & Hormozi Scorer</span> квалифицирует заявки по 4 факторам: Боль, Бюджет, ЛПР и Срочность.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">1. Мгновенная сортировка: Tier 1 VIP (закрывать сегодня) vs прогрев.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">2. Автоматическая генерация Grand Slam оффера под отрасль клиента.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">3. Окупаемость внедрения ($200) — ровно 4 дня.</p>
        <div class="highlight-cta">[CTA] «Пишите "СКОРИНГ" в директ — пришлю интерактивный радар квалификации лидов!»</div>
      `,
      script4: `
        <div class="highlight-hook">[ХУК 0-3 СЕК] «Готовый White-Label AI-бизнес под ключ для агентств и интеграторов в 2026 году.»</div>
        <p style="margin-bottom:28px; color:#cbd5e1;">Хватит продавать чужие SaaS сервисы и отдавать им 80% маржи.</p>
        <p style="margin-bottom:28px;">С пакетом <span class="highlight-fact">Genesis Enterprise ($500)</span> вы получаете суверенную систему с правом перепродажи под собственным брендом.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">1. 5 автономных агентов на базе Python Antigravity Swarm.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">2. 100% маржинальность на каждом внедрении у ваших заказчиков.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">3. Полная изоляция данных и паспорта безопасности Zero-Log.</p>
        <div class="highlight-cta">[CTA] «Забронируйте персональный разбор архитектуры по ссылке прямо сейчас!»</div>
      `,
      script5: `
        <div class="highlight-hook">[ХУК 0-3 СЕК] «Перестаньте отправлять клиентам скучные 30-страничные PDF-аудиты!»</div>
        <p style="margin-bottom:28px; color:#cbd5e1;">Их никто не читает, а конверсия в продажу стремится к нулю.</p>
        <p style="margin-bottom:28px;">Наш <span class="highlight-fact">AI-Агент находит 3 ключевые точки роста</span> конкурента, генерирует 15-секундный скрипт и открывает этот телесуфлер.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">Вы просто записываете 1 дубль на телефон с идеальным зрительным контактом.</p>
        <div class="highlight-cta">[CTA] «Хотите такой же генератор скриптов для вашего отдела? Ссылка в шапке профиля!»</div>
      `,
      script6: `
        <div class="highlight-hook">[ХУК 0-3 СЕК] «Почему ваши рилс и шортс пролистывают через 2 секунды?»</div>
        <p style="margin-bottom:28px; color:#cbd5e1;">Потому что темп речи плавает, а глаза бегают по углам экрана.</p>
        <p style="margin-bottom:28px;">Золотой стандарт удержания 2026 года — <span class="highlight-fact">строго 180 слов в минуту</span> с визуальной линией взгляда прямо в объектив камеры.</p>
        <p style="margin-bottom:28px; color:#cbd5e1;">Телесуфлер PRO держит ваш ритм и исключает запинки.</p>
        <div class="highlight-cta">[CTA] «Попробуйте телесуфлер прямо сейчас — он бесплатный по ссылке в описании!»</div>
      `
    };

    // STATE
    let isPlaying = false;
    let scrollSpeed = 4;
    let currentFontSize = window.innerWidth < 600 ? 30 : 38;
    let isMirrored = false;
    let uiVisible = true;
    let isCameraActive = false;
    let cameraStream = null;
    let wakeLock = null;
    let animationFrameId = null;
    let lastTimestamp = 0;
    let preciseScrollPos = 0;

    // DOM ELEMENTS
    const box = document.getElementById('teleprompter-box');
    const playBtn = document.getElementById('btn-play-pause');
    const speedSlider = document.getElementById('speed-slider');
    const speedBadge = document.getElementById('speed-badge');
    const fontSizeBadge = document.getElementById('font-size-val');
    const mirrorBtn = document.getElementById('btn-mirror');
    const cameraBtn = document.getElementById('btn-camera');
    const scriptSelect = document.getElementById('select-script');
    const topBar = document.getElementById('top-bar');
    const bottomDock = document.getElementById('bottom-dock');
    const webcamVideo = document.getElementById('webcam-video');
    const webcamShade = document.getElementById('webcam-shade');
    const countdownModal = document.getElementById('countdown-modal');

    function init() {
      box.style.fontSize = `${currentFontSize}px`;
      fontSizeBadge.innerText = `${currentFontSize}px`;
      loadScript('script1');

      box.addEventListener('scroll', () => {
        if (!isPlaying) preciseScrollPos = box.scrollTop;
      });

      // Tap text area toggles UI bars
      box.addEventListener('click', (e) => {
        if (e.target.closest('#edit-modal') || e.target.closest('button') || e.target.closest('select')) return;
        toggleUI();
      });

      speedSlider.addEventListener('input', (e) => {
        scrollSpeed = parseInt(e.target.value, 10);
        speedBadge.innerText = `${scrollSpeed}x`;
      });

      scriptSelect.addEventListener('change', (e) => {
        loadScript(e.target.value);
      });
    }

    function loadScript(key) {
      if (key === 'custom') {
        const saved = localStorage.getItem('custom_teleprompter_script');
        if (saved) {
          box.innerHTML = saved;
        } else {
          openEditModal();
        }
      } else {
        box.innerHTML = SCRIPTS[key] || SCRIPTS['script1'];
      }
      resetToTop();
    }

    function resetToTop() {
      pauseScrolling();
      box.scrollTop = 0;
      preciseScrollPos = 0;
    }

    function toggleUI() {
      uiVisible = !uiVisible;
      if (uiVisible) {
        topBar.classList.remove('hidden');
        bottomDock.classList.remove('hidden');
      } else {
        topBar.classList.add('hidden');
        bottomDock.classList.add('hidden');
      }
    }

    function togglePlay() {
      if (isPlaying) {
        pauseScrolling();
      } else {
        startWithCountdown();
      }
    }

    function startWithCountdown() {
      let count = 3;
      countdownModal.innerText = count;
      countdownModal.classList.add('active');

      const countInterval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownModal.innerText = count;
        } else {
          clearInterval(countInterval);
          countdownModal.classList.remove('active');
          resumeScrolling();
        }
      }, 700);
    }

    function resumeScrolling() {
      isPlaying = true;
      playBtn.innerText = '⏸ ПАУЗА';
      playBtn.classList.add('playing');
      requestWakeLock();

      preciseScrollPos = box.scrollTop;
      lastTimestamp = performance.now();
      cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(scrollLoop);
    }

    function pauseScrolling() {
      isPlaying = false;
      playBtn.innerText = '▶ СТАРТ';
      playBtn.classList.remove('playing');
      cancelAnimationFrame(animationFrameId);
      releaseWakeLock();
    }

    function scrollLoop(timestamp) {
      if (!isPlaying) return;

      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      const pixelsPerSec = scrollSpeed * 28;
      preciseScrollPos += (pixelsPerSec * delta);
      box.scrollTop = Math.round(preciseScrollPos);

      if (box.scrollTop + box.clientHeight >= box.scrollHeight - 5) {
        pauseScrolling();
        return;
      }

      animationFrameId = requestAnimationFrame(scrollLoop);
    }

    function changeFontSize(delta) {
      currentFontSize = Math.min(80, Math.max(18, currentFontSize + delta));
      box.style.fontSize = `${currentFontSize}px`;
      fontSizeBadge.innerText = `${currentFontSize}px`;
    }

    function toggleMirror() {
      isMirrored = !isMirrored;
      if (isMirrored) {
        box.classList.add('mirrored');
        mirrorBtn.classList.add('active');
      } else {
        box.classList.remove('mirrored');
        mirrorBtn.classList.remove('active');
      }
    }

    async function toggleCamera() {
      if (!isCameraActive) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          webcamVideo.srcObject = cameraStream;
          webcamVideo.classList.add('active');
          webcamShade.classList.add('active');
          isCameraActive = true;
          cameraBtn.classList.add('active');
        } catch (err) {
          alert('Камера в браузере требует HTTPS или разрешения в телефоне:\n' + err.message + '\n\nВы можете использовать запись в Видео-Студии!');
        }
      } else {
        if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
        webcamVideo.classList.remove('active');
        webcamShade.classList.remove('active');
        isCameraActive = false;
        cameraBtn.classList.remove('active');
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    function openEditModal() {
      const modal = document.getElementById('edit-modal');
      const textarea = document.getElementById('custom-script-text');
      textarea.value = box.innerText.replace(/\n\s*\n/g, '\n\n').trim();
      modal.classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('active');
    }

    function applyCustomScript() {
      const text = document.getElementById('custom-script-text').value;
      const paragraphs = text.split('\n').filter(p => p.trim() !== '');
      const formatted = paragraphs.map((p, idx) => {
        if (idx === 0) return `<div class="highlight-hook">${p}</div>`;
        if (idx === paragraphs.length - 1) return `<div class="highlight-cta">${p}</div>`;
        return `<p style="margin-bottom:28px; color:#e2e8f0;">${p}</p>`;
      }).join('');

      box.innerHTML = formatted;
      localStorage.setItem('custom_teleprompter_script', formatted);
      scriptSelect.value = 'custom';
      closeEditModal();
      resetToTop();
    }

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'Escape') {
        resetToTop();
      }
    });

    window.onload = init;
  </script>
</body>
</html>
